name: Validate FutolStructure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      acceptance_scope:
        description: 'Acceptance scope for Lum or a maintainer'
        required: false
        default: 'source-browser-parser'
        type: choice
        options:
          - source-browser-parser
          - source-only

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Static and engine smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DXF acceptance dependency
        run: python -m pip install -r v3/tools/requirements-dxf.txt

      - name: Install IFC acceptance dependency
        run: python -m pip install -r v3/tools/requirements-ifc.txt

      - name: Validate application source and engine
        run: node v3/tools/check-fs.js --no-browser

      - name: Validate Audit v2 Phase 1A contracts
        run: node v3/tools/check-super-improvement.cjs

      - name: Validate browser workflow and DXF round trip
        if: github.event_name != 'workflow_dispatch' || inputs.acceptance_scope != 'source-only'
        env:
          FS_HEADLESS: '1'
          FS_CDP_TIMEOUT_MS: '120000'
        run: node v3/tools/check-fs.js

      - name: Validate deployment configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8')); console.log('vercel.json: valid')"

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futolstructure-${{ github.run_id }}-acceptance
          path: |
            output/playwright/**
            output/acceptance/**
          if-no-files-found: ignore
          retention-days: 14
